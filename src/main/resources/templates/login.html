<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>

<body>

<h2>勤怠管理システム</h2>

<form th:action="@{/login}" method="post">

    <div>
        メールアドレス
        <input type="text" name="username">
    </div>

    <br>

    <div>
        パスワード
        <input type="password" name="password">
    </div>

    <br>

    <button type="submit">
        ログイン
    </button>

</form>

</body>
</html>
